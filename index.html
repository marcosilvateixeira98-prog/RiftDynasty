<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090f20">
  <title>RIFT DYNASTY — Esports Manager</title>
  <style>
    :root { color-scheme: dark; --accent: #42e2b8; --bg: #080f20; --text: #f2f7ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; background: radial-gradient(circle at 50% 10%, #192d4b 0%, var(--bg) 65%); color: var(--text); font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    header { padding: 16px 16px 12px; text-align: center; }
    h1 { margin: 0; color: var(--accent); font-size: clamp(22px, 5vw, 33px); letter-spacing: .11em; }
    header p { margin: 5px 0 0; color: #adc0dc; font-size: 13px; }
    main { width: min(1020px, 100%); margin: 0 auto; padding: 0 10px 12px; }
    #stage { width: 100%; aspect-ratio: 1000 / 640; border: 2px solid #30445d; border-radius: 13px; overflow: hidden; background: #02050c; box-shadow: 0 15px 40px #0008; position: relative; }
    #stage ruffle-player, #stage ruffle-embed { display: block; width: 100%; height: 100%; }
    #status { padding: 10px 4px; min-height: 38px; text-align: center; color: #aabed7; font-size: 13px; }
    #status.error { color: #ff9eac; }
    #retry { display: none; margin: 0 auto 12px; padding: 11px 20px; background: var(--accent); color: #092322; border: 0; border-radius: 10px; font-weight: bold; cursor: pointer; }
    #retry.visible { display: block; }
    footer { color: #8da4c3; text-align: center; padding: 8px 16px 26px; font-size: 12px; line-height: 1.5; }
    @media (max-width: 600px) { main {padding: 0 5px 10px;} #stage {border-radius: 8px; aspect-ratio: 10/8;} }
  </style>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: 'on',
      unmuteOverlay: 'visible',
      letterbox: 'on',
      contextMenu: 'off',
      splashScreen: false
    };
  </script>
</head>
<body>
  <header>
    <h1>RIFT DYNASTY</h1>
    <p>ESPORTS MANAGER · FLASH EDITION</p>
  </header>
  <main>
    <div id="stage" aria-label="Área do jogo RIFT DYNASTY"></div>
    <div id="status" role="status" aria-live="polite">Carregando o emulador Ruffle…</div>
    <button id="retry" type="button">Tentar novamente</button>
  </main>
  <footer>
    Seu progresso fica salvo neste navegador pelo armazenamento do Flash (SharedObject).<br>
    Se o áudio não iniciar, toque no controle de áudio do jogador.
  </footer>
  <script>
    (function () {
      'use strict';
      var status = document.getElementById('status');
      var retry = document.getElementById('retry');
      var stage = document.getElementById('stage');
      var loading = false;
      function message(text, error) {
        status.textContent = text;
        status.classList.toggle('error', !!error);
        retry.classList.toggle('visible', !!error);
      }
      function addScript(url) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = url;
          s.onload = resolve;
          s.onerror = function () { reject(new Error('Falha ao carregar ' + url)); };
          document.head.appendChild(s);
        });
      }
      async function run() {
        if (loading) return;
        loading = true;
        message('Carregando o emulador Ruffle…', false);
        try {
          // O repositório já tem a pasta flash/ruffle com o motor e seus arquivos WASM.
          if (!window.RufflePlayer || typeof window.RufflePlayer.newest !== 'function') {
            try {
              await addScript('./flash/ruffle/ruffle.js');
            } catch (localError) {
              // Alternativa caso o Ruffle local não esteja disponível.
              await addScript('https://unpkg.com/@ruffle-rs/ruffle');
            }
          }
          if (!window.RufflePlayer || typeof window.RufflePlayer.newest !== 'function') {
            throw new Error('Ruffle não foi inicializado.');
          }
          var source = window.RufflePlayer.newest();
          var player = source.createPlayer();
          player.style.width = '100%';
          player.style.height = '100%';
          stage.replaceChildren(player);
          message('Carregando RiftDynasty.swf…', false);
          // Compatível com a API atual e com versões antigas do Ruffle.
          if (typeof player.ruffle === 'function') {
            await player.ruffle().load('./RiftDynasty.swf');
          } else {
            await player.load('./RiftDynasty.swf');
          }
          message('Jogo carregado. Bom jogo!', false);
        } catch (err) {
          console.error('RIFT DYNASTY — Falha ao carregar SWF:', err);
          message('Não foi possível iniciar o jogo: ' + (err && err.message ? err.message : 'erro desconhecido') + '. Confira os arquivos no GitHub e a compatibilidade do SWF com o Ruffle.', true);
        } finally {
          loading = false;
        }
      }
      retry.addEventListener('click', run);
      window.addEventListener('load', run);
    })();
  </script>
</body>
</html>
