
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>RIFT DYNASTY</title>
  <style>
    body {
      margin: 0;
      background: #080f20;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 { color: #42e2b8; }
    #game {
      width: 100%;
      max-width: 1100px;
      aspect-ratio: 1000 / 640;
      margin: auto;
    }
    ruffle-player {
      width: 100%;
      height: 100%;
    }
  </style>
  <script src="flash/ruffle/ruffle.js"></script>
</head>
<body>
  <h1>RIFT DYNASTY</h1>
  <div id="game"></div>

  <script>
    window.addEventListener("load", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();

      document.getElementById("game")
        .appendChild(player);

      player.load("flash/RiftDynasty.swf");
    });
  </script>
</body>
</html>
